[package]
name = "blog-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
# Core
tokio = { version = "1", features = ["full", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

# HTTP & gRPC (всегда включены)
reqwest = { version = "0.11", features = ["json"] }
tonic = "0.10"
prost = "0.12"

[build-dependencies]
tonic-build = "0.10"