[package]
name = "blog-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web & async
actix-web = "4"
actix-web-httpauth = "0.8"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "tls-rustls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.12"

# gRPC
tonic = "0.10"

# Security
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
rand = "0.8"

[build-dependencies]
tonic-build = "0.10"

