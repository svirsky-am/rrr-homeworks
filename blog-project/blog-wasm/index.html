<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Pet Blog</title>
  <style>
    :root {
      --primary: #6366f1; --primary-hover: #4f46e5;
      --secondary: #64748b; --success: #22c55e; --danger: #ef4444;
      --background: #f8fafc; --surface: #ffffff;
      --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --radius: 12px; --transition: all 0.2s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background); color: var(--text);
      line-height: 1.6; padding: 20px; min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 0; margin-bottom: 2rem; border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.5rem; font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .user-bar { display: flex; align-items: center; gap: 12px; }
    .user-info {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem; color: var(--text-muted);
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 600; font-size: 0.8rem; text-transform: uppercase;
    }
    .card {
      background: var(--surface); border-radius: var(--radius);
      padding: 1.5rem; margin-bottom: 1rem;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .card h3 {
      margin-bottom: 1rem; font-size: 1.1rem; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; margin-bottom: 0.5rem;
      font-size: 0.9rem; font-weight: 500; color: var(--text);
    }
    input, textarea {
      width: 100%; padding: 0.75rem; border: 1px solid var(--border);
      border-radius: 8px; font-size: 1rem; transition: var(--transition);
      background: var(--background);
    }
    input:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
    }
    textarea { min-height: 100px; resize: vertical; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 0.75rem 1.5rem; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 500; cursor: pointer;
      transition: var(--transition); text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: var(--secondary); color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .post {
      border-left: 4px solid var(--primary); padding: 1rem 1.25rem;
      background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0;
      margin-bottom: 0.75rem; box-shadow: var(--shadow);
    }
    .post-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.5rem; gap: 1rem;
    }
    .post-title { font-weight: 600; font-size: 1.1rem; color: var(--text); }
    .post-meta {
      font-size: 0.85rem; color: var(--text-muted);
      display: flex; gap: 1rem; flex-wrap: wrap;
    }
    .post-content {
      color: var(--text); margin: 0.75rem 0;
      white-space: pre-wrap; line-height: 1.5;
    }
    .post-actions {
      display: flex; gap: 0.5rem; margin-top: 0.75rem;
      padding-top: 0.75rem; border-top: 1px solid var(--border);
    }
    .empty-state {
      text-align: center; padding: 3rem 1rem; color: var(--text-muted);
    }
    .empty-state svg {
      width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.5;
    }
    .loading { text-align: center; padding: 2rem; color: var(--text-muted); }
    .loading::after {
      content: '...'; animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; }
    }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
      padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    /* Пагинация */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 0.5rem; margin-top: 1.5rem; padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .pagination button:disabled {
      opacity: 0.5; cursor: not-allowed; transform: none !important;
    }
    .pagination-info {
      font-size: 0.9rem; color: var(--text-muted);
      min-width: 120px; text-align: center;
    }
    @media (max-width: 640px) {
      body { padding: 1rem; }
      .card { padding: 1.25rem; }
      .post-header { flex-direction: column; }
      .btn-group { flex-direction: column; }
      .btn { width: 100%; }
      .pagination { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>📝 Pet Blog</h1>
      <div id="user-bar" class="user-bar hidden">
        <div class="user-info">
          <div class="avatar" id="user-avatar">U</div>
          <span id="username-display">User</span>
        </div>
        <button id="logout-btn" class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- Auth Section -->
    <div id="auth-section">
      <div class="card fade-in" id="register-card">
        <h3>✨ Регистрация</h3>
        <div class="form-group">
          <label for="reg-username">Имя пользователя</label>
          <input id="reg-username" placeholder="alice" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input id="reg-email" placeholder="alice@example.com" type="email" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">Пароль</label>
          <input id="reg-password" placeholder="••••••••" type="password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" onclick="register()">Зарегистрироваться</button>
      </div>
      <div class="card fade-in" id="login-card">
        <h3>🔐 Вход</h3>
        <div class="form-group">
          <label for="login-username">Имя пользователя</label>
          <input id="login-username" placeholder="alice" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input id="login-password" placeholder="••••••••" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" onclick="login()">Войти</button>
      </div>
    </div>

    <!-- Create Post Section -->
    <div id="create-section" class="hidden">
      <div class="card fade-in">
        <h3>✍️ Новый пост</h3>
        <div class="form-group">
          <label for="post-title">Заголовок</label>
          <input id="post-title" placeholder="О чём вы хотите рассказать?">
        </div>
        <div class="form-group">
          <label for="post-content">Содержание</label>
          <textarea id="post-content" placeholder="Напишите что-нибудь интересное..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="createPost()">Опубликовать</button>
      </div>
    </div>

    <!-- Posts Section with Pagination -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3>📚 Посты</h3>
        <button class="btn btn-secondary btn-sm" onclick="loadPosts()">↻ Обновить</button>
      </div>
      <div id="posts-container">
        <div class="loading">Загрузка</div>
      </div>
      
      <!-- Pagination Controls -->
      <div id="pagination" class="pagination hidden">
        <button id="prev-btn" class="btn btn-secondary btn-sm" onclick="changePage(-1)">← Назад</button>
        <span id="page-info" class="pagination-info">Страница 1</span>
        <button id="next-btn" class="btn btn-secondary btn-sm" onclick="changePage(1)">Вперёд →</button>
      </div>
    </div>

    <!-- Error Display -->
    <div id="error-display" class="error hidden"></div>
  </div>

  <script type="module">
    import init, { BlogApp } from './pkg/blog_wasm.js';
    
    let app;
    let currentPage = 0;        // Текущая страница (0-индексированная)
    const postsPerPage = 10;    // Постов на странице
    let totalPosts = 0;         // Общее количество постов
    
    async function start() {
      try {
        await init();
        app = new BlogApp('http://localhost:3000');
        
        // Пытаемся восстановить сессию из localStorage
        if (app.load_session?.()) {
          updateUI();
        }
        
        loadPosts();
      } catch (e) {
        showError('Failed to initialize app: ' + e);
      }
    }
    
    function updateUI() {
      const isAuthenticated = app.is_authenticated();
      const authSection = document.getElementById('auth-section');
      const createSection = document.getElementById('create-section');
      const userBar = document.getElementById('user-bar');
      
      if (isAuthenticated) {
        authSection.classList.add('hidden');
        createSection.classList.remove('hidden');
        userBar.classList.remove('hidden');
        
        const username = app.get_username?.() || 'User';
        document.getElementById('username-display').textContent = username;
        document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
      } else {
        authSection.classList.remove('hidden');
        createSection.classList.add('hidden');
        userBar.classList.add('hidden');
      }
    }
    
    function showError(message) {
      const errorDiv = document.getElementById('error-display');
      errorDiv.textContent = message;
      errorDiv.classList.remove('hidden');
      setTimeout(() => errorDiv.classList.add('hidden'), 5000);
    }
    
    // === Пагинация ===
    
    function changePage(direction) {
      const newPage = currentPage + direction;
      if (newPage >= 0 && newPage * postsPerPage < totalPosts) {
        currentPage = newPage;
        loadPosts();
      }
    }
    
    function updatePagination() {
      const pagination = document.getElementById('pagination');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const pageInfo = document.getElementById('page-info');
      
      if (totalPosts === 0) {
        pagination.classList.add('hidden');
        return;
      }
      
      pagination.classList.remove('hidden');
      
      const totalPages = Math.ceil(totalPosts / postsPerPage);
      const currentDisplayPage = currentPage + 1;
      
      pageInfo.textContent = `Страница ${currentDisplayPage} из ${totalPages}`;
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage >= totalPages - 1;
    }
    
    // === API вызовы ===
    
    window.register = async () => {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      
      if (!username || !email || !password) {
        showError('Please fill all fields');
        return;
      }
      
      try {
        await app.register(username, email, password);
        updateUI();
        loadPosts(); // Сброс на первую страницу
        document.getElementById('reg-username').value = '';
        document.getElementById('reg-email').value = '';
        document.getElementById('reg-password').value = '';
      } catch (e) {
        showError('Registration failed: ' + e);
      }
    };
    
    window.login = async () => {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      
      if (!username || !password) {
        showError('Please enter username and password');
        return;
      }
      
      try {
        await app.login(username, password);
        updateUI();
        loadPosts(); // Сброс на первую страницу
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
      } catch (e) {
        showError('Login failed: ' + e);
      }
    };
    
    window.logout = () => {
      app.logout?.();
      updateUI();
      loadPosts(); // Перезагружаем посты (теперь без кнопок автора)
    };
    
    window.createPost = async () => {
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      
      if (!title || !content) {
        showError('Please enter title and content');
        return;
      }
      
      try {
        await app.create_post(title, content);
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        loadPosts(); // Сброс на первую страницу после создания
      } catch (e) {
        showError('Failed to create post: ' + e);
      }
    };
    
    window.loadPosts = async () => {
      const container = document.getElementById('posts-container');
      container.innerHTML = '<div class="loading">Загрузка</div>';
      
      try {
        const offset = currentPage * postsPerPage;
        const list = await app.load_posts(postsPerPage, offset);
        
        totalPosts = list.total;
        updatePagination();
        
        if (!list.posts || list.posts.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <p>Пока нет постов. Будьте первым!</p>
            </div>
          `;
          return;
        }
        
        const currentUserId = app.get_current_author_id?.();
        
        container.innerHTML = list.posts.map(p => {
          // Показываем кнопки только если пользователь авторизован И является автором поста
          const isAuthor = currentUserId != null && currentUserId === p.author_id;
          const date = new Date(p.created_at).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'short', year: 'numeric'
          });
          
          return `
            <div class="post fade-in">
              <div class="post-header">
                <div class="post-title">${escapeHtml(p.title)}</div>
                <div class="post-meta">
                  <span>by #${p.author_id}</span>
                  <span>•</span>
                  <span>${date}</span>
                </div>
              </div>
              <div class="post-content">${escapeHtml(p.content)}</div>
              ${isAuthor ? `
                <div class="post-actions">
                  <button class="btn btn-secondary btn-sm" onclick="editPost(${p.id}, ${JSON.stringify(escapeHtml(p.title))}, ${JSON.stringify(escapeHtml(p.content))})">✏️ Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deletePost(${p.id})">🗑️ Delete</button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
        
      } catch (e) {
        container.innerHTML = `<p class="error">Failed to load posts: ${e}</p>`;
      }
    };
    
    window.deletePost = async (id) => {
      if (!confirm('Delete this post?')) return;
      
      try {
        await app.delete_post(id);
        loadPosts();
      } catch (e) {
        showError('Failed to delete: ' + e);
      }
    };
    
    window.editPost = async (id, title, content) => {
      const newTitle = prompt('New title:', title);
      if (newTitle === null) return;
      
      const newContent = prompt('New content:', content);
      if (newContent === null) return;
      
      try {
        await app.update_post(id, newTitle, newContent);
        loadPosts();
      } catch (e) {
        showError('Failed to update: ' + e);
      }
    };
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    start();
  </script>
</body>
</html>
