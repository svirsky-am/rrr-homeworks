<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blog WASM</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    .form { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
    .post { margin: 10px 0; padding: 10px; border-left: 3px solid #007bff; }
    .error { color: red; }
    button { margin: 5px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>📝 Blog WASM Client</h1>
  
  <div id="auth-section">
    <div class="form">
      <h3>Register</h3>
      <input id="reg-username" placeholder="Username">
      <input id="reg-email" placeholder="Email" type="email">
      <input id="reg-password" placeholder="Password" type="password">
      <button onclick="register()">Register</button>
    </div>
    
    <div class="form">
      <h3>Login</h3>
      <input id="login-username" placeholder="Username">
      <input id="login-password" placeholder="Password" type="password">
      <button onclick="login()">Login</button>
    </div>
    
    <div id="user-info"></div>
    <button id="logout-btn" onclick="logout()" style="display:none">Logout</button>
  </div>
  
  <div class="form">
    <h3>Create Post</h3>
    <input id="post-title" placeholder="Title">
    <textarea id="post-content" placeholder="Content"></textarea>
    <button onclick="createPost()">Create</button>
  </div>
  
  <div>
    <h3>Posts</h3>
    <button onclick="loadPosts()">Refresh</button>
    <div id="posts-list"></div>
  </div>
  
  <script type="module">
    import init, { BlogApp } from './pkg/blog_wasm.js';
    
    let app;
    
    async function start() {
      await init();
      app = new BlogApp('http://localhost:3000');
      
      // Проверка авторизации при загрузке
      if (app.is_authenticated()) {
        document.getElementById('logout-btn').style.display = 'inline';
        document.getElementById('user-info').textContent = '✅ Authenticated';
      }
      
      loadPosts();
    }
    
    window.register = async () => {
      try {
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        
        const resp = await app.register(username, email, password);
        document.getElementById('user-info').textContent = `✅ Registered: ${resp.user.username}`;
        document.getElementById('logout-btn').style.display = 'inline';
        loadPosts();
      } catch (e) {
        alert('Error: ' + e);
      }
    };
    
    window.login = async () => {
      try {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        
        const resp = await app.login(username, password);
        document.getElementById('user-info').textContent = `✅ Logged in: ${resp.user.username}`;
        document.getElementById('logout-btn').style.display = 'inline';
        loadPosts();
      } catch (e) {
        alert('Error: ' + e);
      }
    };
    
    window.logout = () => {
      app.logout();
      document.getElementById('user-info').textContent = '';
      document.getElementById('logout-btn').style.display = 'none';
    };
    
    window.createPost = async () => {
      try {
        const title = document.getElementById('post-title').value;
        const content = document.getElementById('post-content').value;
        
        const post = await app.create_post(title, content);
        alert('Post created: ' + post.title);
        loadPosts();
      } catch (e) {
        alert('Error: ' + e);
      }
    };
    
    window.loadPosts = async () => {
      try {
        const list = await app.load_posts(10, 0);
        const container = document.getElementById('posts-list');
        container.innerHTML = list.posts.map(p => 
          `<div class="post">
            <strong>#${p.id}</strong> ${p.title} 
            <small>(by #${p.author_id})</small><br>
            ${p.content}
          </div>`
        ).join('');
      } catch (e) {
        document.getElementById('posts-list').innerHTML = `<p class="error">Error: ${e}</p>`;
      }
    };
    
    start();
  </script>
</body>
</html>
