[workspace]
members = [
# module 1
    "streaming_quotes_project",
# module 2
    "rr-parser-lib",
    "rr-file-processor", 
# module3
    "blog-project/*", 
# "sandbox_env", 
]
resolver = "2"


# Зависимости для модуля 3 

[workspace.dependencies]
# Общие зависимости для всех крейтов
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
dotenvy = "0.15"

# gRPC/protobuf
tonic = "0.10"
prost = "0.12"
tonic-build = "0.10"

# HTTP
reqwest = { version = "0.11", features = ["json"] }
actix-web = "4"
actix-web-httpauth = "0.8"
actix-cors = "0.7"

# Security
jsonwebtoken = "9"
argon2 = "0.5"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "tls-rustls"] }

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", 
    "HtmlTextAreaElement", "Storage", "console", "Event", "MouseEvent"
]}
gloo-net = "0.6"