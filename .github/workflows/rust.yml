name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    

env:
  CARGO_TERM_COLOR: always

jobs:

  # Detect which paths changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.filter.outputs.core }}
      streaming_changed: ${{ steps.filter.outputs.streaming }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for PRs to compare correctly

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'rr-parser-lib/**'
              - 'rr-file-processor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            streaming:
              - 'streaming_quotes_project/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            blogproject:
              - 'blog-project/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            image_ffi_project:
              - 'image_ffi_project/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            is_not_broken_app:
              - 'is-not-broken-app/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
  # Job 1: Build & test core crates (rr-parser-lib + rr-file-processor)
  build-and-test-core:
    needs: changes
    if: ${{ needs.changes.outputs.core_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rr-parser-lib
        run: cargo build -p rr-parser-lib --verbose

      - name: Build rr-file-processor
        run: cargo build -p rr-file-processor --verbose

      - name: Run tests for rr-parser-lib
        run: cargo test -p rr-parser-lib --verbose

      - name: Run tests for rr-file-processor
        run: cargo test -p rr-file-processor --verbose

      - name: Run integrated tests (core)
        run: make run-integrated-tests

  # Job 2: Build & test streaming_quotes_project
  build-and-test-streaming:
    needs: changes
    if: ${{ needs.changes.outputs.streaming_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build streaming_quotes_project
        run: cargo build -p streaming_quotes_project --verbose

      - name: Run tests for streaming_quotes_project
        run: cargo test -p streaming_quotes_project --test integration -- --nocapture

  # Job 3: Build blog-project
  build-and-test-blog:
    needs: changes
    if: ${{ needs.changes.outputs.blogproject_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blog-project server
        run: 	SQLX_OFFLINE=true cargo build -p blog-server --release

      - name: Build blog-project cli
        run: 	cargo build -p blog-cli --release

  # Job 4: Build & test image_ffi_project
  build-and-test-image-ffi-project:
    needs: changes
    if: ${{ needs.changes.outputs.image_ffi_project == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mirror_plugin
        run: cargo test -p  "mirror_plugin" --release

      - name: Build blur_plugin
        run: cargo test -p  "blur_plugin" --release

      - name: Build and test image_processor
        run: cargo test -p  "image_processor" --test integration -- --nocapture


  # Job 5: Build & test "is not broken app"
  build-and-test-is-not-broken-app:
    needs: changes
    if: ${{ needs.changes.outputs.is_not_broken_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build benches
        run: RUSTFLAGS="-Awarnings" cargo bench --bench criterion -p is-not-broken-app
